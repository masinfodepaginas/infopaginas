<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funciones Ganamos</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071738;
      color: white;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 23, 56, 0.96);
      backdrop-filter: blur(8px);
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      border-radius: 16px;
      padding: 15px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      box-shadow: 0 10px 24px rgba(0,0,0,.20);
    }

    .btn-download {
      background: #fff;
      color: #111;
    }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }

    .viewer-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 10px 24px;
    }

    .viewer-frame {
      width: 100%;
      height: calc(100vh - 110px);
      border: none;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }

    .fallback {
      text-align: center;
      color: rgba(255,255,255,.85);
      font-size: 14px;
      margin-top: 12px;
    }

    @media (max-width: 640px) {
      .btn {
        width: 100%;
        min-width: 0;
        font-size: 17px;
        padding: 14px 16px;
      }

      .viewer-frame {
        height: calc(100vh - 150px);
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <a class="btn btn-download" href="/funciones-ganamos/funciones-ganamos.pdf" download>
        Descargar PDF
      </a>

      <a class="btn btn-whatsapp" href="https://wa.me/541168722199" target="_blank" rel="noopener noreferrer">
        Contactanos
      </a>
    </div>
  </div>

  <div class="viewer-wrap">
    <iframe
      class="viewer-frame"
      src="https://mozilla.github.io/pdf.js/web/viewer.html?file=https://infopaginas.vercel.app/funciones-ganamos/funciones-ganamos.pdf">
    </iframe>

    <div class="fallback">
      Si el visor tarda en cargar, podés usar el botón <strong>Descargar PDF</strong>.
    </div>
  </div>

</body>
</html>
