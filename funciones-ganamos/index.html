<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funciones Ganamos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#18042d;
      --bg2:#4b1792;
      --bg3:#8b2cf5;
      --text:#ffffff;
      --muted:rgba(255,255,255,.82);
      --card:rgba(255,255,255,.08);
      --line:rgba(255,255,255,.14);
      --white:#ffffff;
      --green:#25D366;
      --shadow:0 18px 50px rgba(0,0,0,.30);
      --radius:24px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:'Inter',sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top right, rgba(199,72,255,.25), transparent 25%),
        radial-gradient(circle at bottom left, rgba(123,58,237,.22), transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
      min-height:100vh;
    }

    .wrap{
      width:min(1100px, calc(100% - 24px));
      margin:24px auto 36px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }

    .hero{
      padding:28px;
      text-align:center;
    }

    .badge{
      display:inline-block;
      padding:8px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      font-size:13px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:16px;
    }

    h1{
      margin:0 0 12px 0;
      font-size:clamp(30px,5vw,52px);
      line-height:1.02;
      font-weight:800;
      letter-spacing:-0.02em;
    }

    .sub{
      max-width:780px;
      margin:0 auto;
      font-size:16px;
      line-height:1.6;
      color:var(--muted);
    }

    .actions{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:14px;
      margin-top:26px;
    }

    .btn{
      min-height:56px;
      border-radius:16px;
      font-size:17px;
      font-weight:700;
      text-decoration:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:0 18px;
      transition:.2s ease;
      box-shadow:0 10px 28px rgba(0,0,0,.18);
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-view{
      background:linear-gradient(135deg,#d946ef,#7c3aed);
      color:#fff;
    }

    .btn-download{
      background:#fff;
      color:#2b1456;
    }

    .btn-whatsapp{
      background:var(--green);
      color:#fff;
    }

    .btn svg{
      width:22px;
      height:22px;
      flex:0 0 22px;
    }

    .preview-wrap{
      padding:0 28px 28px;
    }

    .preview{
      display:block;
      width:100%;
      max-width:760px;
      margin:0 auto;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:0 16px 40px rgba(0,0,0,.28);
      background:#2b0a4f;
    }

    .note{
      text-align:center;
      color:var(--muted);
      font-size:14px;
      margin-top:14px;
      line-height:1.5;
    }

    @media (max-width: 820px){
      .actions{
        grid-template-columns:1fr;
      }

      .hero{
        padding:22px 18px;
      }

      .preview-wrap{
        padding:0 18px 22px;
      }

      h1{
        font-size:38px;
      }

      .sub{
        font-size:15px;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
      <div class="hero">
        <div class="badge">Ganamos · Manual oficial</div>
        <h1>Funciones Ganamos</h1>
        <p class="sub">
          Accedé al manual completo de funcionalidades del panel. Podés verlo directamente, descargarlo en PDF o comunicarte por WhatsApp.
        </p>

        <div class="actions">
          <a class="btn btn-view" href="/funciones-ganamos/funciones-ganamos.pdf" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M2.25 12s3.75-6.75 9.75-6.75S21.75 12 21.75 12 18 18.75 12 18.75 2.25 12 2.25 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 15.75A3.75 3.75 0 1 0 12 8.25a3.75 3.75 0 0 0 0 7.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Ver manual
          </a>

          <a class="btn btn-download" href="/funciones-ganamos/funciones-ganamos.pdf" download>
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 20h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Descargar PDF
          </a>

          <a class="btn btn-whatsapp" href="https://wa.me/541168722199" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 32 32" fill="currentColor">
              <path d="M16.001 3C9.373 3 4 8.372 4 15c0 2.646.862 5.09 2.316 7.066L4 29l7.184-2.276A11.946 11.946 0 0016.001 27C22.628 27 28 21.627 28 15S22.628 3 16.001 3zm0 21.8c-1.92 0-3.792-.51-5.43-1.476l-.388-.23-4.263 1.35 1.392-4.153-.252-.42A9.776 9.776 0 016.2 15c0-5.413 4.388-9.8 9.8-9.8s9.8 4.387 9.8 9.8-4.388 9.8-9.8 9.8zm5.364-7.336c-.294-.147-1.737-.858-2.006-.956-.27-.098-.466-.147-.662.147s-.76.956-.932 1.154c-.172.196-.343.221-.637.074-.294-.147-1.24-.457-2.362-1.458-.872-.777-1.46-1.735-1.632-2.029-.172-.294-.018-.452.129-.599.132-.132.294-.343.441-.515.147-.172.196-.294.294-.49.098-.196.049-.368-.025-.515-.074-.147-.662-1.593-.907-2.181-.239-.574-.482-.496-.662-.506-.172-.01-.368-.012-.564-.012s-.515.074-.785.368c-.27.294-1.03 1.006-1.03 2.453s1.055 2.845 1.202 3.041c.147.196 2.078 3.173 5.032 4.447.703.303 1.252.484 1.68.619.706.224 1.348.192 1.856.116.566-.084 1.737-.71 1.982-1.396.245-.686.245-1.274.172-1.396-.073-.122-.27-.196-.564-.343z"/>
            </svg>
            Contactanos
          </a>
        </div>
      </div>

      <div class="preview-wrap">
        <img
          class="preview"
          src="/funciones-ganamos/funciones-ganamos-preview.jpg"
          alt="Vista previa del manual Funciones Ganamos"
        />
        <div class="note">
          Tocá <strong>Ver manual</strong> para abrir el PDF completo con visualización óptima en celular.
        </div>
      </div>
    </section>
  </div>
</body>
</html>
