<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funciones Ganamos</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: #071738;
      font-family: Arial, sans-serif;
      color: white;
    }

    body {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 23, 56, 0.98);
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      border-radius: 16px;
      padding: 15px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      box-shadow: 0 10px 24px rgba(0,0,0,.20);
    }

    .btn-download {
      background: #fff;
      color: #111;
    }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }

    .viewer-wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0;
      background: #071738;
    }

    .viewer-frame {
      width: 100%;
      height: calc(100vh - 105px);
      border: none;
      display: block;
      background: #071738;
    }

    .fallback {
      text-align: center;
      color: rgba(255,255,255,.82);
      font-size: 14px;
      padding: 10px 14px 18px;
    }

    @media (max-width: 640px) {
      .btn {
        width: 100%;
        min-width: 0;
        font-size: 17px;
        padding: 14px 16px;
      }

      .viewer-frame {
        height: calc(100vh - 150px);
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <a class="btn btn-download" href="/funciones-ganamos/funciones-ganamos.pdf" download>
        Descargar PDF
      </a>

      <a class="btn btn-whatsapp" href="https://wa.me/541168722199" target="_blank" rel="noopener noreferrer">
        Contactanos
      </a>
    </div>
  </div>

  <div class="viewer-wrap">
    <embed
      class="viewer-frame"
      src="/funciones-ganamos/funciones-ganamos.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
      type="application/pdf">
    <div class="fallback">
      Si tu navegador muestra controles propios del visor, eso depende del celular. El botón Descargar PDF siempre queda disponible.
    </div>
  </div>

</body>
</html>
