<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funciones Ganamos</title>
  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0b1635;
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:18px 10px 30px;
    }

    .wrap{
      width:100%;
      max-width:760px;
    }

    .top-buttons{
      position:sticky;
      top:12px;
      z-index:20;
      display:flex;
      gap:12px;
      justify-content:center;
      margin-bottom:14px;
    }

    .btn{
      text-decoration:none;
      font-weight:700;
      font-size:18px;
      border-radius:16px;
      padding:16px 22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:190px;
      box-shadow:0 10px 24px rgba(0,0,0,.25);
    }

    .download{
      background:#fff;
      color:#111;
    }

    .whatsapp{
      background:#25D366;
      color:#fff;
    }

    .pdf-view{
      display:block;
      width:100%;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 14px 30px rgba(0,0,0,.35);
      background:#1b1038;
    }

    .pdf-view img{
      display:block;
      width:100%;
      height:auto;
    }

    .hint{
      text-align:center;
      color:#d9def0;
      font-size:14px;
      margin-top:12px;
      opacity:.9;
    }

    @media (max-width: 640px){
      .top-buttons{
        gap:10px;
      }

      .btn{
        min-width:0;
        width:48%;
        font-size:16px;
        padding:14px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="top-buttons">
      <a class="btn download" href="/funciones-ganamos/funciones-ganamos.pdf" download>
        Descargar PDF
      </a>

      <a class="btn whatsapp" href="https://wa.me/541168722199" target="_blank" rel="noopener noreferrer">
        Contactanos
      </a>
    </div>

    <a class="pdf-view" href="/funciones-ganamos/funciones-ganamos.pdf" target="_blank" rel="noopener noreferrer">
      <img src="/funciones-ganamos/preview.jpg" alt="Vista previa del manual Funciones Ganamos">
    </a>

    <div class="hint">
      Tocá la imagen para abrir el manual completo.
    </div>

  </div>
</body>
</html>
