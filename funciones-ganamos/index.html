<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funciones Ganamos</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071738;
      color: white;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(7, 23, 56, 0.96);
      backdrop-filter: blur(8px);
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .topbar-inner {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      border-radius: 16px;
      padding: 15px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      box-shadow: 0 10px 24px rgba(0,0,0,.20);
    }

    .btn-download {
      background: #fff;
      color: #111;
    }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }

    .viewer {
      max-width: 980px;
      margin: 18px auto 40px;
      padding: 0 10px;
    }

    .page {
      margin: 0 auto 18px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }

    .page canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .loading {
      text-align: center;
      color: rgba(255,255,255,.85);
      font-size: 16px;
      padding: 30px 10px;
    }

    @media (max-width: 640px) {
      .btn {
        width: 100%;
        min-width: 0;
        font-size: 17px;
        padding: 14px 16px;
      }

      .viewer {
        padding: 0 8px;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">
      <a class="btn btn-download" href="/funciones-ganamos/funciones-ganamos.pdf" download>
        Descargar PDF
      </a>

      <a class="btn btn-whatsapp" href="https://wa.me/541168722199" target="_blank" rel="noopener noreferrer">
        Contactanos
      </a>
    </div>
  </div>

  <div class="viewer">
    <div class="loading" id="loading">Cargando manual...</div>
    <div id="pdf-container"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.js"></script>
  <script>
    const url = '/funciones-ganamos/funciones-ganamos.pdf';
    const container = document.getElementById('pdf-container');
    const loading = document.getElementById('loading');

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.js';

    async function renderPDF() {
      try {
        const pdf = await pdfjsLib.getDocument(url).promise;
        loading.style.display = 'none';

        const isMobile = window.innerWidth < 768;
        const targetWidth = isMobile ? window.innerWidth - 24 : 900;

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1 });
          const scale = targetWidth / viewport.width;
          const scaledViewport = page.getViewport({ scale });

          const pageWrap = document.createElement('div');
          pageWrap.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');

          canvas.width = scaledViewport.width;
          canvas.height = scaledViewport.height;

          pageWrap.appendChild(canvas);
          container.appendChild(pageWrap);

          await page.render({
            canvasContext: context,
            viewport: scaledViewport
          }).promise;
        }
      } catch (error) {
        loading.innerHTML = 'No se pudo cargar el manual.';
        console.error(error);
      }
    }

    renderPDF();
  </script>

</body>
</html>
